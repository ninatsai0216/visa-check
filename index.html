<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行簽證查核</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 左欄為行程與國籍輸入（像報到櫃檯的查核單），右欄為各國籍結果卡；手機時上下堆疊 */
:root{
  --paper:#f4f6f9; --sheet:#ffffff; --ink:#18263a; --muted:#5b6b80; --line:#d8dfe8;
  --navy:#1d3557; --navy-soft:#e6ecf5;
  --ok:#1f7a4d; --ok-bg:#e3f3ea;
  --warn:#9a6200; --warn-bg:#fdf1d8;
  --bad:#b3261e; --bad-bg:#fbe3e1;
  --unk:#5f6670; --unk-bg:#eceef1;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1722; --sheet:#16212f; --ink:#e4eaf2; --muted:#94a3b6; --line:#2a3849;
  --navy:#8fb3e6; --navy-soft:#1d2c40;
  --ok:#6fd19c; --ok-bg:#163a29; --warn:#f2c26b; --warn-bg:#3a2d12;
  --bad:#ff958c; --bad-bg:#45201d; --unk:#b4bcc6; --unk-bg:#26303c; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1722; --sheet:#16212f; --ink:#e4eaf2; --muted:#94a3b6; --line:#2a3849;
  --navy:#8fb3e6; --navy-soft:#1d2c40;
  --ok:#6fd19c; --ok-bg:#163a29; --warn:#f2c26b; --warn-bg:#3a2d12;
  --bad:#ff958c; --bad-bg:#45201d; --unk:#b4bcc6; --unk-bg:#26303c; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:28px;font-weight:900;letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.datechip{font-family:var(--font-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:22px}
@media (min-width:861px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.step{display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:baseline;gap:10px}
.step-n{font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--sheet);background:var(--navy);border-radius:3px;padding:1px 6px}
.step-h h2{font-size:16px;margin:0;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label .opt{font-weight:400;opacity:.85}
.picker{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-soft);color:var(--ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px}
.chip code{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.chip button:hover{background:var(--line);color:var(--ink)}
input[type=text],input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.14);z-index:5;max-height:280px;overflow:auto;padding:4px;margin:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer}
.list li[aria-selected=true],.list li:hover{background:var(--navy-soft)}
.list li span:last-child{color:var(--muted);font-size:12px}
.list .none{color:var(--muted);cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.route{display:grid;grid-template-columns:minmax(0,.85fr) auto minmax(0,1.3fr);gap:8px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.route input[type=text]{background:var(--sheet)}
.route .list{min-width:240px}
.route .picker[data-key="dest"] .list{left:auto;right:0}
.list li span:first-child{white-space:nowrap}
.route .arrow{padding-top:30px;color:var(--muted);font-size:18px;font-weight:700}
.privacy{font-size:12.5px;color:var(--ok);background:var(--ok-bg);border-radius:7px;padding:8px 10px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.summary{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.example{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 8px;margin-right:6px}
.trip{font-size:14px;color:var(--muted)}
.trip b{color:var(--ink);font-weight:500}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-unk{background:var(--unk)}
.pill{display:inline-flex;align-items:flex-start;gap:6px;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:500;line-height:1.5;max-width:100%;overflow-wrap:anywhere}
.pill .dot{margin-top:.5em}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-unk{background:var(--unk-bg);color:var(--unk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{margin:0;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.card-h h3 code{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:500}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:11px 16px;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.row .k{font-size:13px;color:var(--muted);padding-top:2px}
.row .k b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.row .v{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note a,.foot a{color:var(--navy)}
.card-f{font-size:12px;color:var(--muted);padding:9px 16px;background:var(--paper);border-top:1px solid var(--line);margin-top:auto}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--muted);text-align:center}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.foot p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{max-width:100%}
@media (max-width:440px){.route{grid-template-columns:minmax(0,1fr)} .route .arrow{padding-top:0;line-height:1;transform:rotate(90deg);justify-self:start;margin-left:10px} .route .picker[data-key="dest"] .list{left:0;right:auto}}
.topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.lang{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}
.lang:hover{border-color:var(--navy)}
.lang:focus-within{outline:2px solid var(--navy);outline-offset:2px}
.lang .globe{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.lang select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;padding:7px 32px 7px 34px;min-height:36px;cursor:pointer}
.lang select:focus{outline:none}
.lang::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
html[lang="ja"]{--font-body:"Noto Sans JP","Noto Sans TC","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
html[lang="zh-Hans"]{--font-body:"Noto Sans SC","Noto Sans TC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body>


<div class="wrap">
  <div class="topbar">
    <label class="lang" for="lang-sel">
      <svg class="globe" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <select id="lang-sel" aria-label="Language / 語言">
        <option value="zh">繁體中文</option>
        <option value="zh-hans">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
      </select>
    </label>
  </div>
  <header class="top">
    <div>
      <h1 data-i="title">旅行簽證查核</h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <span class="datechip" data-i="dataver"></span>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off">
      <section class="step">
        <div class="step-h"><span class="step-n">1</span><h2 data-i="s1"></h2></div>
        <div class="field">
          <label for="nat-in" data-i="natLabel"></label>
          <div class="picker" data-key="nat"><div class="chips"></div><input type="text" id="nat-in" data-ph="natPh" role="combobox" aria-expanded="false" aria-autocomplete="list"></div>
        </div>
        <p class="privacy" data-i="privacy"></p>
      </section>
      <section class="step">
        <div class="step-h"><span class="step-n">2</span><h2 data-i="s2"></h2></div>
        <div class="route">
          <div class="field">
            <label for="origin-in" data-i="origin"></label>
            <div class="picker" data-key="origin" data-max="1"><div class="chips"></div><input type="text" id="origin-in" data-ph="originPh" role="combobox" aria-expanded="false" aria-autocomplete="list"></div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
          <div class="field">
            <label for="dest-in" data-i="dest"></label>
            <div class="picker" data-key="dest"><div class="chips"></div><input type="text" id="dest-in" data-ph="destPh" role="combobox" aria-expanded="false" aria-autocomplete="list"></div>
          </div>
        </div>
        <div class="field">
          <label for="transit-in"><span data-i="transitLabel"></span> <span class="opt" data-i="transitOpt"></span></label>
          <div class="picker" data-key="transit"><div class="chips"></div><input type="text" id="transit-in" data-ph="transitPh" role="combobox" aria-expanded="false" aria-autocomplete="list"></div>
        </div>
      </section>
      <div class="actions">
        <button type="button" class="btn" id="clear" data-i="clear"></button>
        <button type="button" class="btn" id="sample" data-i="sample"></button>
      </div>
    </form>

    <section class="results" aria-live="polite">
      <div class="summary" id="summary"></div>
      <div id="cards" class="cards"></div>
      <footer class="foot">
        <p data-i="foot1"></p>
        <p data-i="foot2"></p>
        <p data-i="foot4"></p>
      </footer>
    </section>
  </div>
</div>

function T(k,...a){ const v=I18N[L][k]; return typeof v==='function'? v(...a) : v; }
const LANGS = ['zh','zh-hans','en','ja','es'];
const NAME_IDX = {zh:0,en:1,'zh-hans':2,ja:3,es:4};
const HTML_LANG = {zh:'zh-Hant-TW','zh-hans':'zh-Hans',en:'en',ja:'ja',es:'es'};
const NAME = c => { const n=D.names[c]||[c,c]; return n[NAME_IDX[L]]||n[1]; };

const SCHENGEN = new Set('AT BE BG CH CZ DE DK EE ES FI FR GR HR HU IS IT LI LT LU LV MT NL NO PL PT RO SE SI SK CY'.split(' '));
const LINK_URL = {
  GB:'https://www.gov.uk/eta',
  US:'https://esta.cbp.dhs.gov/',
  CA:'https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/eta.html',
  NZ:'https://www.immigration.govt.nz/visas/new-zealand-electronic-travel-authority-nzeta/',
  AU:'https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-finder',
  KR:'https://www.k-eta.go.kr/'
};
const LINK = c => LINK_URL[c] ? [T('links')[c], LINK_URL[c]] : null;
// 電子旅行授權費用：逐一核對各國官網（FEE_CHECKED）。未能核對的金額標「請人工查證」
function feeText(c){
  const a={checked:T('checked'), verify:T('verify')};
  switch(c){
    case 'GB': return '£20'+a.checked;
    case 'US': return 'US$40.62'+a.checked;
    case 'CA': return 'CA$7'+a.checked;
    case 'NZ': return T('nzFee',a);
    case 'KR': return 'KRW 10,000'+a.checked;
  }
  return null;
}
function feeNote(c){ const f=feeText(c); return f ? T('feeRef',f) : T('feeManual'); }
const SPECIAL_CN = new Set(['CN','HK','MO']);

const state = {origin:['TW'], dest:[], transit:[], nat:[]};
const SAMPLE = {origin:['TW'], dest:['GB','FR'], transit:['AE'], nat:['TW','US','MY','IN']};
let isSample = false;

function raw(p,d){ const r=D.rows[p]; if(!r) return null; const t=r.split(',')[IDX[d]]; return (t===undefined||t==='')?null:t; }

// level: 0 ok, 1 warn(需申請/落地), 2 unk(人工確認), 3 bad(需簽證), 4 ban
function entry(p,d){
  if(p===d) return {lv:0,label:T('citizen'),notes:[]};
  if(p==='TW' && SPECIAL_CN.has(d)) return {lv:2,label:T('special'),notes:[T('tw'+d)]};
  const t=raw(p,d);
  if(t===null) return {lv:2,label:T('nodata'),notes:[]};
  if(/^\d+$/.test(t)) return {lv:0,label:T('freeDays',t),free:true,notes:[]};
  switch(t){
    case 'F': return {lv:0,label:T('free'),free:true,notes:[]};
    case 'A': return {lv:1,label:T('voa'),notes:[T('voaNote')]};
    case 'T': return {lv:1,label:T('eta'),notes:[]};
    case 'E': return {lv:1,label:T('evisa'),notes:[]};
    case 'R': return {lv:3,label:T('visa'),notes:[T('visaNote')]};
    case 'N': return {lv:4,label:T('ban'),notes:[]};
    case 'S': return {lv:0,label:T('citizen'),notes:[]};
  }
  return {lv:2,label:T('nodata'),notes:[]};
}
function destResult(p,d){
  const e=entry(p,d); e.links=[];
  const r=raw(p,d);
  if(e.lv===1 && r==='T'){ e.notes.push(feeNote(d)); if(LINK(d)) e.links.push(LINK(d)); }
  if(r==='E'||r==='R'||r==='A') e.notes.push(T('visaFee'));
  if(e.free && SCHENGEN.has(d)) e.notes.push(T('etias'));
  if(d==='KR' && e.free && p!=='KR'){ e.lv=2; e.label=T('krLabel',e.label); e.notes.push(T('krNote')); e.notes.push(feeNote('KR')); e.links.push(LINK('KR')); }
  return e;
}
// 英國 DATV 國籍（gov.uk Transit guidance v9.0，2026/03/25）
const UK_DATV = new Set('AF AL DZ AO BD BY MM BI CM CG CD EG ER ET MK GM GH GN GW IN IR IQ CI JM KE XK LB LS LR LY MW MD MN NP NG PK PS CN RW SN RS SL SO ZA SS LK SD SZ SY TZ TR UG VN YE ZW'.split(' '));
// 申根共同機場過境簽證（ATV）國籍，EU Visa Code Annex IV
const SCH_ATV = new Set('AF BD CD ER ET GH IR IQ NG PK SO LK'.split(' '));
// 沒有國際轉機區、轉機也須入境的國家
const NO_AIRSIDE = new Set(['US','CA']);
function transitResult(p,t){
  const e=entry(p,t);
  if(p===t) return {lv:0,label:T('citizen'),notes:[],links:[]};
  if(NO_AIRSIDE.has(t)){
    if(e.free) return {lv:0,label:T('canEnterFree'),notes:[T('noAirsideFree',NAME(t))],links:[]};
    const r={lv:Math.max(e.lv,1),label:T('mustEnter',e.label),notes:[T('noAirsideNote',NAME(t))],links:[]};
    if(raw(p,t)==='T'){ r.notes.push(feeNote(t)); if(LINK(t)) r.links.push(LINK(t)); }
    else r.notes.push(T('visaFee'));
    return r;
  }
  if(t==='GB' && UK_DATV.has(p))
    return {lv:3,label:T('datv'),notes:[T('datvNote')],links:[[T('datvLink'),'https://www.gov.uk/transit-visa']]};
  if(SCHENGEN.has(t) && SCH_ATV.has(p))
    return {lv:3,label:T('atv'),notes:[T('atvNote')],links:[]};
  if(SCHENGEN.has(t) && raw(p,t)==='R')
    return {lv:2,label:T('atvCheck'),notes:[T('atvCheckNote',NAME(t))],links:[]};
  if(t==='AU'||t==='NZ')
    return {lv:2,label:T('auNz'),notes:[T('auNzNote',NAME(t))],links:LINK(t)?[LINK(t)]:[]};
  const notes=[T('transitRule')];
  if(!e.free) notes.push(T('ifExit',e.label));
  if(t==='GB') notes.push(T('gbAirside'));
  return {lv:0,label:T('airsideOk'),notes,links:[]};
}
function returnResult(p,o){
  if(p===o) return {lv:0,label:T('retOwn'),notes:[],links:[]};
  if(o==='TW'){
    if(SPECIAL_CN.has(p)) return {lv:2,label:T('retCN'),notes:[T('retCNNote')],links:[]};
    return {lv:1,label:T('retARC'),notes:[T('retARCNote'),T('retDual')],links:[]};
  }
  const e=entry(p,o);
  const notes=[T('retOtherNote',NAME(o))];
  if(e.lv!==2) notes.push(T('retOtherNote2',NAME(o),e.label));
  return {lv:2,label:T('retOther'),notes,links:[]};
}

const LVC = ['ok','warn','unk','bad','bad'];
const ORDER = [4,3,2,1,0]; // 嚴重度排序
function pill(lv,text){ return '<span class="pill p-'+LVC[lv]+'"><span class="dot d-'+LVC[lv]+'"></span>'+esc(text)+'</span>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const sum=document.getElementById('summary'), cards=document.getElementById('cards');
  const O=state.origin[0], sep=T('sep');
  const tripBits=[
    T('route')+' <b>'+esc(O?NAME(O):T('noOrigin'))+' → '+esc(state.dest.map(NAME).join(sep)||T('noDest'))+'</b>',
    T('transit')+' <b>'+esc(state.transit.map(NAME).join(sep)||T('none'))+'</b>'
  ];
  if(!O || !state.dest.length || !state.nat.length){
    sum.innerHTML='<div class="trip">'+tripBits.join('　·　')+'</div>'+legend();
    cards.innerHTML='<div class="empty">'+(!state.nat.length?T('emptyNat'):!O?T('emptyOrigin'):T('emptyDest'))+T('emptyTail')+'</div>';
    return;
  }
  const items=state.nat.map(p=>{
    const rows=[];
    state.dest.forEach(d=>rows.push({k:T('rowDest'),n:NAME(d),r:destResult(p,d)}));
    state.transit.forEach(t=>rows.push({k:T('rowTransit'),n:NAME(t),r:transitResult(p,t)}));
    rows.push({k:T('rowReturn',NAME(O)),n:'',r:returnResult(p,O)});
    const worst=Math.max(...rows.map(x=>x.r.lv));
    return {p,rows,worst};
  }).sort((a,b)=>b.worst-a.worst);

  const allOk=items.filter(i=>i.worst===0).length;
  const counts={}; items.forEach(i=>i.rows.forEach(r=>{counts[r.r.lv]=(counts[r.r.lv]||0)+1;}));
  const LVT=T('lv');
  const countPills=ORDER.filter(l=>counts[l]).map(l=>pill(l,T('countPill',LVT[l],counts[l]))).join('');
  sum.innerHTML=
    '<div>'+(isSample?'<span class="example">'+T('example')+'</span>':'')+T('summary',items.length,allOk,items.length-allOk)+'</div>'+
    '<div class="trip">'+tripBits.join('　·　')+'</div>'+
    '<div class="counts">'+countPills+'</div>'+legend();

  cards.innerHTML=items.map(it=>{
    const levels={}; it.rows.forEach(r=>levels[r.r.lv]=(levels[r.r.lv]||0)+1);
    const head = it.worst===0 ? pill(0,T('allOk')) : ORDER.filter(l=>l>0&&levels[l]).map(l=>pill(l,T('headPill',LVT[l],levels[l]))).join(' ');
    const rows=it.rows.map(x=>{
      const r=x.r;
      const notes=r.notes.map(n=>'<p class="note">'+esc(n)+'</p>').join('');
      const links=r.links.map(l=>'<p class="note"><a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+' ↗</a></p>').join('');
      return '<div class="row"><div class="k">'+esc(x.k)+(x.n?'<b>'+esc(x.n)+'</b>':'')+'</div><div class="v">'+pill(r.lv,r.label)+notes+links+'</div></div>';
    }).join('');
    const foot = it.p==='TW' ? '' : '<div class="card-f">'+T('cardFoot')+'</div>';
    return '<article class="card"><div class="card-h"><h3>'+esc(NAME(it.p))+'<code>'+it.p+'</code></h3><div>'+head+'</div></div><div class="rows">'+rows+'</div>'+foot+'</article>';
  }).join('');
}
function legend(){
  const g=T('lg');
  return '<div class="legend"><span><i class="dot d-ok"></i>'+g[0]+'</span><span><i class="dot d-warn"></i>'+g[1]+'</span><span><i class="dot d-bad"></i>'+g[2]+'</span><span><i class="dot d-unk"></i>'+g[3]+'</span></div>';
}

// ---- 國家選擇器 ----
const ALL = D.order.slice();
const POOL = {origin: ()=>ALL, dest: ()=>ALL.filter(c=>c!==state.origin[0]), transit: ()=>ALL.filter(c=>c!==state.origin[0]), nat: ()=>ALL.filter(c=>D.rows[c])};
const ALIAS = {AE:'阿聯 杜拜 阿布達比 UAE Dubai Abu Dhabi',GB:'英國 UK 大英 Britain England',US:'USA America',KR:'南韓 korea 韓國',NL:'荷蘭 Holland',TR:'Turkey Istanbul 伊斯坦堡',QA:'杜哈 Doha',HK:'Hong Kong',CZ:'捷克共和國 Czech',TW:'臺灣 ROC',CN:'中國 大陸 China'};
function matches(c,q){
  q=q.trim().toLowerCase(); if(!q) return true;
  const n=D.names[c]||[c,c];
  const hay=(n.join(' ')+' '+c+' '+(ALIAS[c]||'')).toLowerCase();
  return hay.includes(q);
}
const pickers=[];
document.querySelectorAll('.picker').forEach(pk=>{
  const key=pk.dataset.key, input=pk.querySelector('input'), chips=pk.querySelector('.chips');
  const list=document.createElement('ul'); list.className='list'; list.hidden=true; list.id=key+'-list'; list.setAttribute('role','listbox');
  input.setAttribute('aria-controls',list.id); pk.appendChild(list);
  let opts=[], active=0;
  function draw(){
    chips.innerHTML=state[key].map(c=>'<span class="chip">'+esc(NAME(c))+' <code>'+c+'</code><button type="button" aria-label="'+esc(T('remove')+NAME(c))+'" data-c="'+c+'">×</button></span>').join('');
  }
  pickers.push(draw);
  function other(c){ const n=D.names[c]||[c,c]; return L==='en'? n[0] : n[1]; }
  function open(){
    const q=input.value;
    opts=POOL[key]().filter(c=>!state[key].includes(c)&&matches(c,q));
    const ql=q.trim().toLowerCase();
    opts.sort((a,b)=>score(b,ql)-score(a,ql));
    opts=opts.slice(0,40); active=0;
    list.innerHTML = opts.length ? opts.map((c,i)=>'<li role="option" id="'+key+'-o'+i+'" data-c="'+c+'" aria-selected="'+(i===0)+'"><span>'+esc(NAME(c))+'</span><span>'+esc(other(c))+' · '+c+'</span></li>').join('') : '<li class="none">'+T('noMatch')+'</li>';
    list.hidden=false; input.setAttribute('aria-expanded','true');
  }
  function score(c,q){ if(!q) return 0; const n=D.names[c]; const al=(ALIAS[c]||'').toLowerCase().split(' '); if(n.some(x=>x.toLowerCase()===q)||c.toLowerCase()===q||al.includes(q)) return 3; if(n.some(x=>x.toLowerCase().startsWith(q))) return 2; return 1; }
  function close(){ list.hidden=true; input.setAttribute('aria-expanded','false'); }
  const single = pk.dataset.max==='1';
  function pick(c){
    if(!c) return; isSample=false; input.value='';
    if(single){ state[key]=[c]; state.dest=state.dest.filter(x=>x!==c); state.transit=state.transit.filter(x=>x!==c); drawAll(); close(); input.blur(); return; }
    state[key].push(c); draw(); render(); open();
  }
  function hl(){ [...list.children].forEach((li,i)=>li.setAttribute('aria-selected',i===active)); const el=list.children[active]; if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  input.addEventListener('focus',open);
  input.addEventListener('input',open);
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault(); if(list.hidden)open(); active=Math.min(active+1,opts.length-1); hl();}
    else if(e.key==='ArrowUp'){e.preventDefault(); active=Math.max(active-1,0); hl();}
    else if(e.key==='Enter'){e.preventDefault(); if(opts[active]) pick(opts[active]);}
    else if(e.key==='Escape'){close();}
    else if(e.key==='Backspace'&&!input.value&&state[key].length){state[key].pop(); isSample=false; draw(); render();}
  });
  input.addEventListener('blur',()=>setTimeout(close,150));
  list.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-c]'); if(li){e.preventDefault(); pick(li.dataset.c);}});
  chips.addEventListener('click',e=>{const b=e.target.closest('button[data-c]'); if(b){state[key]=state[key].filter(c=>c!==b.dataset.c); isSample=false; draw(); render();}});
});
function drawAll(){ pickers.forEach(d=>d()); render(); }

// ---- 語言切換 ----
function applyLang(){
  document.documentElement.lang = HTML_LANG[L];
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(el=>{ el.innerHTML=T(el.dataset.i); });
  document.querySelectorAll('[data-ph]').forEach(el=>{ el.placeholder=T(el.dataset.ph); });
  document.getElementById('lang-sel').value = L;
  drawAll();
}
document.getElementById('lang-sel').addEventListener('change',e=>{
  L=e.target.value; try{ localStorage.setItem('visa-lang',L); }catch(err){}
  applyLang();
});

document.getElementById('form').addEventListener('submit',e=>e.preventDefault());
document.getElementById('clear').addEventListener('click',()=>{state.dest=[];state.transit=[];state.nat=[];isSample=false;drawAll();});
document.getElementById('sample').addEventListener('click',()=>{Object.assign(state,JSON.parse(JSON.stringify(SAMPLE)));isSample=true;drawAll();});
Object.assign(state,JSON.parse(JSON.stringify(SAMPLE))); isSample=true;
applyLang();
})();
</script>

</body>
</html>
